dependencies:
  idf:
    version: ">=6.0.3"
  # ESP-Hosted bridges Wi-Fi + BT through the on-board ESP32-C6 on the
  # FireBeetle 2 ESP32-P4 (DFR1172). Other targets have a native radio, so
  # guard these components with target rules.
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    # esp_hosted 3.0 restructured its BT Kconfig (breaking change); stay on 2.x
    # until wendy-lite migrates.
    version: ">=2.0,<3.0"
    rules:
      - if: "target == esp32p4"
  wendy_core:
    git: "https://github.com/wendylabsinc/wendy-lite.git"
    path: "components/wendy_core"
